app = 'sub-son1k-2-2'
primary_region = "iad" # Ashburn, Virginia (donde se creó la DB)

[env]
  PORT = "3000"

[build]
  dockerfile = "Dockerfile"

# [deploy]
#   release_command = "sh -c 'cd packages/backend && npx prisma db push'"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
